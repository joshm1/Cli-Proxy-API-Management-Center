name: Build and Release

on:
  push:
    branches:
      - 'josh/management-panel'
    tags:
      - 'v*'

concurrency:
  group: panel-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    if: github.ref_type == 'tag' || github.repository == 'joshm1/Cli-Proxy-API-Management-Center'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all-in-one HTML
        if: github.ref_type == 'tag'
        run: bun run build
        env:
          VERSION: ${{ github.ref_name }}

      - name: Verify and build the fork panel
        if: github.ref_type == 'branch'
        run: VERSION="$(git describe --tags --match 'v[0-9]*' --abbrev=0)" bun run verify

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${current_tag}"
          else
            range="${current_tag}"
          fi

          : > release-notes.md
          git log --pretty=format:"- %h %s" "${range}" >> release-notes.md

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/management.html
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the fork panel
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)"
          if [[ "$branch_head" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is at the branch tip."
            exit 0
          fi

          tag="josh-panel-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/management.html --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" dist/management.html --target "$GITHUB_SHA" --latest \
              --title "Josh management panel (${GITHUB_SHA:0:12})" --notes "Built from $GITHUB_SHA."
          fi
